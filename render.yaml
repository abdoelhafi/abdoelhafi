# Render Blueprint for Cut-Out Studio (the app lives in cutout-studio/).
# Deploy: https://render.com/deploy?repo=https://github.com/abdoelhafi/abdoelhafi
services:
  - type: web
    name: cutout-studio
    runtime: docker
    rootDir: cutout-studio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Rendering runs a real Chromium: "starter" (512 MB) works for one render at a time; "standard" is faster.
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: cutout-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-flash-latest
