# Render Blueprint for Cut-Out Studio (the app lives in cutout-studio/).
# Deploy: https://render.com/deploy?repo=https://github.com/abdoelhafi/abdoelhafi
services:
  - type: web
    name: cutout-studio
    runtime: docker
    rootDir: cutout-studio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Rendering a video needs about 600 MB-1 GB: "standard" (2 GB). Free and "starter" have 512 MB (set LOW_MEMORY=1; no MP4 render).
    plan: standard
    healthCheckPath: /healthz
    disk:
      name: cutout-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_SHARED_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-flash-latest
