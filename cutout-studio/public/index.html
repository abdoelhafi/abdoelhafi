<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cut-Out Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside id="side">
  <div class="brand"><span class="logo-dot"></span>Cut-Out Studio</div>
  <button id="newProject" class="btn primary wide">+ New video</button>
  <nav id="projects"></nav>
  <div class="side-foot">
    <div id="status" class="status"></div>
    <button id="openSettings" class="btn ghost wide">Brand &amp; style settings</button>
  </div>
</aside>

<main id="main">
  <div id="empty" class="empty">
    <h1>Prompt in, paper cut-out video out.</h1>
    <p>Type a theme, pick a fact-checked story, write the script, make the images in Gemini, generate the voice, and render a vertical MP4.</p>
    <button class="btn primary" onclick="document.getElementById('newProject').click()">Start a new video</button>
  </div>

  <div id="workspace" hidden>
    <header class="ws-head">
      <input id="projectName" class="title-input" aria-label="Project name">
      <button id="deleteProject" class="btn ghost small">Delete</button>
    </header>
    <ol id="steps" class="steps">
      <li data-step="ideas"><b>1</b>Ideas</li>
      <li data-step="script"><b>2</b>Script</li>
      <li data-step="assets"><b>3</b>Images</li>
      <li data-step="voice"><b>4</b>Voice</li>
      <li data-step="video"><b>5</b>Video</li>
    </ol>
    <section id="panel"></section>
  </div>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Brand &amp; style</h2>
    <label>Brand name <input name="brand.name"></label>
    <label>What the brand is <textarea name="brand.description" rows="3"></textarea></label>
    <label>How the brand may appear <textarea name="brand.ending" rows="2"></textarea></label>
    <label>Content rules (one per line) <textarea name="brand.rules" rows="4"></textarea></label>
    <label class="row"><input type="checkbox" name="brand.showLogo"> Show the logo on the end card</label>
    <label>Logo SVG <textarea name="brand.logoSvg" rows="3" class="mono"></textarea></label>
    <label>Idea family <textarea name="ideaFamily" rows="3"></textarea></label>
    <label>Gemini style block (prefixed to every image prompt) <textarea name="style.block" rows="4"></textarea></label>
    <label>Character pose <input name="style.characterPose"></label>
    <fieldset class="grid4">
      <legend>ElevenLabs voice settings</legend>
      <label>Stability <input name="voice.stability" type="number" step="0.05" min="0" max="1"></label>
      <label>Similarity <input name="voice.similarity_boost" type="number" step="0.05" min="0" max="1"></label>
      <label>Style <input name="voice.style" type="number" step="0.05" min="0" max="1"></label>
      <label class="row"><input type="checkbox" name="voice.use_speaker_boost"> Speaker boost</label>
    </fieldset>
    <div class="actions">
      <button value="reset" class="btn ghost" id="resetSettings" type="button">Reset to uKeep defaults</button>
      <span class="grow"></span>
      <button value="cancel" class="btn ghost">Cancel</button>
      <button value="save" class="btn primary" id="saveSettings">Save</button>
    </div>
  </form>
</dialog>

<dialog id="confirm"><form method="dialog"><h2 id="confirmTitle"></h2><div id="confirmBody"></div>
  <div class="actions"><span class="grow"></span><button value="no" class="btn ghost">Cancel</button><button value="yes" class="btn primary" id="confirmYes">Continue</button></div></form></dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
