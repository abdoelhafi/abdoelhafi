<!doctype html>
<html><head><meta charset="utf-8">
<title>Cut-out player</title>
<style>
@font-face{font-family:News;src:url(/engine/fonts/Newsreader-Bold.ttf)}
html,body{margin:0;background:#000}
body.preview{background:#111;display:flex;flex-direction:column;align-items:center;font:14px system-ui,sans-serif;color:#ddd}
#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}
body.preview #wrap{transform-origin:0 0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#24324F}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.cam,.fixed{position:absolute;inset:0;transform-origin:540px 960px}
.fixed{pointer-events:none}
.bg{position:absolute;inset:0;width:1080px;height:1920px}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.el{position:absolute;will-change:transform}
.in{position:relative;width:100%;height:100%}
.pc{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 10px rgba(15,18,30,.38))}
.missing{background:repeating-linear-gradient(45deg,#c2502f55 0 20px,#0000 20px 40px);border:4px dashed #C2502F;color:#fff;font:600 36px system-ui;display:flex;align-items:center;justify-content:center;min-height:120px}
.shape{width:100%;height:100%}
.txt{font-family:News,Georgia,serif;text-align:center;white-space:nowrap;line-height:1.02;display:inline-block}
.txt-strip{color:#1B2238;background:#F3EAD6;padding:18px 34px 22px;font-size:76px;box-shadow:0 12px 14px rgba(0,0,0,.35)}
.txt-stamp{color:#F3EAD6;background:#C2502F;padding:10px 40px 18px;font-size:150px;box-shadow:0 12px 14px rgba(0,0,0,.35)}
.txt-label{color:#1B2238;background:#F3EAD6;padding:10px 22px 12px;font-size:44px;box-shadow:0 8px 10px rgba(0,0,0,.3)}
.txt-plain{color:#F3EAD6;font-size:96px;text-shadow:0 6px 0 #1B2238,0 10px 16px rgba(0,0,0,.4)}
.spark{position:absolute}
.qm{position:absolute;font-family:News,Georgia,serif;font-size:130px;color:#1B2238;background:#F3EAD6;width:150px;height:170px;text-align:center;line-height:170px;box-shadow:0 10px 12px rgba(0,0,0,.35)}
.note{position:absolute;width:190px;height:120px;background:#F6EFD9;box-shadow:0 8px 10px rgba(0,0,0,.3)}
.note i{position:absolute;left:18px;height:8px;border-radius:4px;background:#8C8F99}
.beam{position:absolute;left:0;right:0;height:26px;box-shadow:0 0 30px 10px rgba(225,167,58,.6)}
.tick{position:absolute;inset:0;font-family:News,Georgia,serif;text-align:center;box-shadow:0 10px 10px rgba(0,0,0,.3);transform-origin:50% 100%}
.row{position:absolute;left:28px;height:22px;border-radius:11px;background:#C9CDD6}
.contact{position:relative;background:#fff;overflow:hidden;font-family:Inter,system-ui,sans-serif}
.c-top{position:absolute;left:0;right:0;top:0;height:21%}
.c-av{position:absolute;left:50%;top:13.5%;width:120px;height:120px;margin-left:-60px;border-radius:50%;font:600 48px/120px system-ui,sans-serif;color:#1B2238;text-align:center}
.c-name{position:absolute;left:0;right:0;top:33%;text-align:center;font:700 40px system-ui,sans-serif;color:#111}
.c-sub{position:absolute;left:0;right:0;top:41%;text-align:center;font:500 26px system-ui,sans-serif;color:#555}
.c-note{position:absolute;left:30px;right:30px;top:51%;padding:18px 20px;border-radius:18px;background:#FBEFD8;font:600 26px/1.3 system-ui,sans-serif;color:#1B2238}
.c-note span{font-weight:500;color:#555}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;z-index:999}
#controls{display:none;gap:10px;align-items:center;padding:10px;width:100%;box-sizing:border-box;justify-content:center;flex-wrap:wrap}
body.preview #controls{display:flex}
#controls button{background:#2a2f3c;color:#eee;border:1px solid #444;padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit}
#scrub{flex:1;min-width:160px;max-width:520px}
#warn{color:#f0b37e;font-size:12px;max-width:520px;padding:0 10px}
</style></head>
<body>
<div id="controls"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.00</span></div>
<div id="warn"></div>
<div id="frame"><div id="wrap"><div id="stage"></div></div></div>
<audio id="audio" preload="auto"></audio>
<script src="/vendor/gsap.min.js"></script>
<script src="/engine/engine.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const project = q.get('project');
  const mode = q.get('mode') || 'preview';
  const T = await (await fetch(`/api/projects/${project}/timeline/resolved`)).json();
  if (T.error) { document.body.textContent = T.error; return; }
  await document.fonts.load('76px News').catch(() => {});
  const out = CutoutEngine.build(T);
  window.tl = out.tl;
  window.seek = (t) => { out.tl.seek(t, false); }; // return nothing: Playwright would try to serialize the timeline
  window.cutout = { duration: out.duration, warnings: out.warnings, sfxEvents: out.sfxEvents };
  // wait for every image to decode before saying we are ready
  await Promise.all([...document.images].map((i) => i.complete ? i.decode().catch(() => {}) : new Promise((r) => { i.onload = i.onerror = r; })));
  await document.fonts.ready;
  window.cutoutReady = true;
  if (mode !== 'preview') return;

  document.body.classList.add('preview');
  const warn = document.getElementById('warn');
  if (out.warnings.length) warn.textContent = 'Warnings: ' + out.warnings.join(' · ');
  const wrap = document.getElementById('wrap'), frame = document.getElementById('frame');
  const fit = () => {
    const s = Math.min((innerHeight - 70) / 1920, (innerWidth - 20) / 1080);
    wrap.style.transform = `scale(${s})`; frame.style.width = 1080 * s + 'px'; frame.style.height = 1920 * s + 'px';
  };
  fit(); addEventListener('resize', fit);
  const audio = document.getElementById('audio');
  if (T.audio) audio.src = T.audio;
  const scrub = document.getElementById('scrub'), time = document.getElementById('time'), btn = document.getElementById('play');
  let playing = false, t0 = 0, startAt = 0;
  const show = (t) => { out.tl.seek(t, false); scrub.value = (t / out.duration) * 1000; time.textContent = t.toFixed(2) + 's'; };
  const loop = () => {
    if (!playing) return;
    const t = T.audio && !audio.paused ? audio.currentTime : startAt + (performance.now() - t0) / 1000;
    if (t >= out.duration) { playing = false; btn.textContent = 'Play'; show(out.duration); return; }
    show(t); requestAnimationFrame(loop);
  };
  btn.onclick = () => {
    playing = !playing; btn.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      startAt = out.tl.time() >= out.duration - 0.05 ? 0 : out.tl.time(); t0 = performance.now();
      if (T.audio) { audio.currentTime = startAt; audio.play().catch(() => {}); }
      loop();
    } else audio.pause();
  };
  scrub.oninput = () => { const t = (scrub.value / 1000) * out.duration; audio.currentTime = t; startAt = t; t0 = performance.now(); show(t); };
  show(Number(q.get('t') || 0));
})();
</script>
</body></html>
